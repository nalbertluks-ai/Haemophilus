<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelo A · Haemophilus influenzae</title>
<style>
  :root{
    --bg:#12100e; --bg-2:#1a1714; --bg-3:#24201c;
    --fg:#f3e9d9; --fg-dim:#a89e90; --fg-mute:#6b6358; --linha:rgba(243,233,217,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  body{font-family:"Inter Variable","Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased}
  #cena{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  #cena.arrastando{cursor:grabbing}
  #vinheta{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 42% 50%,transparent 38%,rgba(6,5,4,.62) 100%)}

  #cabecalho{position:fixed;top:28px;left:32px;pointer-events:none;max-width:420px}
  #cabecalho .k{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--fg-mute);margin-bottom:10px}
  #cabecalho h1{margin:0;font-size:26px;font-weight:650;letter-spacing:-.01em;line-height:1.05}
  #cabecalho h1 i{font-weight:400}
  #cabecalho p{margin:10px 0 0;font-size:12px;line-height:1.6;color:var(--fg-dim)}

  #medidor{position:fixed;left:32px;bottom:24px;font:11px/1.5 "JetBrains Mono Variable","Cascadia Code",Consolas,monospace;color:var(--fg-mute);pointer-events:none}
  #medidor b{color:var(--fg-dim);font-weight:500}

  #painel{position:fixed;top:20px;right:20px;bottom:20px;width:292px;padding:18px 18px 14px;border-radius:14px;
    background:rgba(26,23,20,.86);border:1px solid var(--linha);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bg-3) transparent}
  #painel h2{margin:0 0 12px;font-size:9.5px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--fg-mute)}
  #painel h2:not(:first-child){margin-top:20px;padding-top:16px;border-top:1px solid var(--linha)}
  .ctl{margin:0 0 11px}
  .ctl .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:11.5px;color:var(--fg)}
  .ctl .top span:last-child{font:10.5px "JetBrains Mono Variable",Consolas,monospace;color:var(--fg-dim)}
  .ctl small{display:block;font-size:10px;color:var(--fg-mute);margin-top:3px;line-height:1.35}
  input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:3px;margin:0;border-radius:2px;background:rgba(243,233,217,.14);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fg);border:none;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--fg);cursor:pointer}
  #estruturas{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #estruturas button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;
    border:1px solid var(--linha);font-size:11px;line-height:1.15;color:var(--fg-dim);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
  #estruturas button:hover{background:rgba(243,233,217,.06);color:var(--fg)}
  #estruturas button.ativo{background:rgba(243,233,217,.12);color:var(--fg);border-color:rgba(243,233,217,.4)}
  #estruturas button i{flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:var(--c)}
  #estruturas button.todos{grid-column:1 / -1;justify-content:center}
  .linha{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--fg-dim);margin:0 0 8px;cursor:pointer;user-select:none}
  .linha input{accent-color:#f3e9d9}
  #aviso{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:40px;font-size:13px;line-height:1.7;background:var(--bg);z-index:9}
  @media (max-width:860px){ #painel{top:auto;left:12px;right:12px;bottom:12px;width:auto;max-height:44vh} #cabecalho{left:16px;top:16px} #medidor{display:none} }
</style>
</head>
<body>
<canvas id="cena"></canvas>
<div id="vinheta"></div>

<header id="cabecalho">
  <div class="k">Modelo anatômico · variante A</div>
  <h1><i>Haemophilus influenzae</i></h1>
  <p>Cocobacilo Gram-negativo, imóvel, não esporulado. Arraste para girar, role para aproximar.</p>
</header>

<div id="medidor"></div>

<aside id="painel">
  <h2>Estado</h2>
  <div id="controles"></div>
  <label class="linha"><input type="checkbox" id="auto" checked> Rotação lenta no eixo longo</label>
  <h2>Destaque · legenda de cores</h2>
  <div id="estruturas"></div>
</aside>

<div id="aviso"></div>
<script type="module" src="./modelo-a.js"></script>
</body>
</html>
